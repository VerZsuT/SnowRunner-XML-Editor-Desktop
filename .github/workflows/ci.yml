name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: check, lint, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test

  rust:
    name: cargo test, clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npx vite build

      - name: Типы для TS не расходятся с Rust
        run: |
          cargo run --manifest-path src-tauri/Cargo.toml --bin typegen
          git diff --exit-code src/renderer/api/bindings.ts

      - run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --all-targets
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

  package:
    name: package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run tauri:build

      - name: Портативная сборка
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/SnowRunnerXMLEditor.exe portable/
          New-Item -ItemType File -Force portable/portable.txt | Out-Null
          Compress-Archive -Path portable/* -DestinationPath SnowRunnerXMLEditor-portable.zip

      - name: Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: SnowRunnerXMLEditor
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            SnowRunnerXMLEditor-portable.zip
